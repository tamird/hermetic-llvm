name: Run the static GNU pthread cancellation test
on:
  push:
    branches: [qualification/static-glibc-direct-native]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'tamird/hermetic-llvm' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Run the public native test
        run: |
          d="$RUNNER_TEMP/unwind"
          mkdir -p "$d/dist"
          cp .github/workflows/static_native.py "$d/"
          test "$(git rev-parse HEAD^)" = 1273f916be8c7109542be8fef009258a56369462
          git checkout --detach HEAD^
          curl -fsSL --retry 3 https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o "$d/bazel"
          echo "e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  $d/bazel" | sha256sum -c -
          chmod +x "$d/bazel"
          for url in https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz https://ftpmirror.gnu.org/glibc/glibc-2.44.tar.xz https://mirror.bazel.build/ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz; do
            if curl -fsSL --max-time 70 "$url" -o "$d/download" && echo "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667  $d/download" | sha256sum -c -; then
              mv "$d/download" "$d/dist/glibc-2.44.tar.xz"
              break
            fi
          done
          env -i HOME="$HOME" USER="$USER" PATH="$d:$PATH" LANG=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python3 -B "$d/static_native.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-static-gnu-pthread
          path: ${{ runner.temp }}/unwind/report.json
          if-no-files-found: error
          retention-days: 3
